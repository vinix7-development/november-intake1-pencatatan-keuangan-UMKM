<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplikasi Pencatatan Keuangan untuk Bisnis UMKM</title>
<style>:root{--accent:#2563eb;--bg:#f5f7fe}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:#1d2230}
main{padding:24px;width:100%;min-width:0}
h2{font-size:22px;margin-bottom:16px}h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid #e3e6ee;border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.grid>.card{margin:0}
.k{color:#667085;font-size:13px}.v{font-size:24px;font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{color:#667085;font-weight:600}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
label{display:grid;gap:4px;font-size:13px;color:#475467}
input,select{font:inherit;padding:8px 10px;border:1px solid #cfd4df;border-radius:8px;background:#fff;width:100%}
.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.alt{background:#eef0f5;color:#1d2230}.btn.sm{padding:4px 10px;font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.g{background:#dcfae6;color:#085d3a}.y{background:#fef0c7;color:#7a4504}.r{background:#fee4e2;color:#912018}.n{background:#eef0f5;color:#344054}
.bar{height:10px;background:#eef0f5;border-radius:99px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--accent)}
.bar i.y{background:#f79009}.bar i.r{background:#d92d20}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#toast{position:fixed;right:16px;bottom:16px;background:#1d2230;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
.note{font-size:12px;color:#667085;margin-top:18px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut>div{width:116px;height:116px;border-radius:50%;background:var(--card,#fff);display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px}
.legend{list-style:none;flex:1;min-width:180px}.legend li{display:flex;gap:8px;align-items:center;padding:4px 0}.legend i{width:10px;height:10px;border-radius:3px}.legend b{margin-left:auto}
.cols{display:flex;gap:18px;align-items:flex-end;height:240px;padding-top:10px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:#667085}
.col>div{display:flex;gap:4px;align-items:flex-end;flex:1;width:100%;justify-content:center}.col i{width:32%;max-width:34px;border-radius:5px 5px 0 0;background:var(--accent)}.col i.y{background:#f79009}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-bottom:16px}.split>.card{margin:0}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}

/* aplikasi keuangan: navigasi atas, kartu saldo besar, lembut */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 4vw;background:#fff;border-bottom:1px solid #e6eaf5}
header h1{font-size:18px;color:#1d4ed8}
#nav{display:flex;gap:6px;overflow-x:auto;background:#eef2fc;padding:5px;border-radius:99px;max-width:100%}
#nav button{border:0;background:none;font:inherit;padding:8px 16px;border-radius:99px;cursor:pointer;white-space:nowrap;color:#475467}
#nav button.on{background:#1d4ed8;color:#fff}
main{padding:28px 4vw}.card{border:0;border-radius:22px;box-shadow:0 6px 24px #1d4ed812;padding:22px}
.btn,input,select{border-radius:99px!important}
.hero{background:linear-gradient(120deg,#1d4ed8,#4f46e5);color:#fff;border-radius:28px;padding:30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.hero .big{font-size:42px;font-weight:800}
.pill{background:#ffffff1f;border-radius:18px;padding:14px 22px}
.wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}.wallets .card{margin:0;border-top:5px solid var(--accent)}
.feed{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef0f5}.in{color:#067647;font-weight:700}.out{color:#b42318;font-weight:700}
svg.area{width:100%;height:230px}

header h1{max-width:560px;line-height:1.3}.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menu{padding:14px 4vw 0;display:flex}main{padding-top:18px}
.profit{background:#067647;color:#fff}.profit.loss{background:#b42318}
.rec{border-left:4px solid;padding:8px 12px;margin-bottom:10px;border-radius:0}.rec.r{border-color:#d92d20;background:#fef3f2;color:#7a271a}.rec.y{border-color:#f79009;background:#fffaeb;color:#7a4504}.rec.g{border-color:#12b76a;background:#ecfdf3;color:#085d3a}.rec.n{border-color:#98a2b3;background:#f2f4f7}
.hero{display:block;text-align:center;border-radius:0;padding:70px 6vw;margin:0}.hero h2{font-size:clamp(26px,4vw,44px);line-height:1.2}.hero p{max-width:620px;margin:0 auto 18px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:28px 6vw}.feat .card{margin:0}.feat .ic{font-size:30px}
.steps{text-align:center}footer{text-align:center;padding:24px;color:#667085;font-size:13px}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}.auth .card{width:min(420px,100%)}
form.stack{grid-template-columns:1fr;margin:10px 0}.link{color:var(--accent);cursor:pointer;text-decoration:underline}
</style></head><body><div id="root"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const opt=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
const table=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="k">Belum ada data.</td></tr>`}</table></div>`;
const stat=(k,v,s='')=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="k">${s}</div></div>`;
const bar=(label,right,pct,c='')=>`<div class="row"><span>${label}</span><span class="k">${right}</span></div><div class="bar"><i class="${c}" style="width:${Math.min(100,pct)}%"></i></div>`;
let timer;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2800)}
function readForm(e){e.preventDefault();return Object.fromEntries(new FormData(e.target))}
function csv(name,rows){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=name;a.click()}

const T='Aplikasi Pencatatan Keuangan untuk Bisnis UMKM';
const NOW='2026-11',TODAY='2026-11-26';
const IN=['penjualan','pendapatan_lain','modal'];
const LABEL={penjualan:'Penjualan',pendapatan_lain:'Pendapatan lain',modal:'Setoran modal',hpp:'HPP (bahan/barang)',operasional:'Operasional',prive:'Prive (diambil pemilik)'};
const defaults=()=>[['Penjualan toko','penjualan'],['Pendapatan lain','pendapatan_lain'],['Modal pemilik','modal'],['Bahan baku','hpp'],['Gaji','operasional'],['Sewa','operasional'],['Listrik & air','operasional'],['Transport','operasional'],['Promosi','operasional'],['Ambil pribadi','prive']];
const newBiz=(name,owner,email,pass)=>({name,owner,email,pass,cats:defaults(),acc:{Kas:0,Rekening:0},tx:[],bud:{}});
const demo=newBiz('Usaha Demo','Pemilik Demo','demo@umkm.test','demo1234');demo.acc={Kas:1000000,Rekening:15000000};
[['09',9200000,4300000,2600000],['10',10500000,4900000,2700000],['11',9800000,5200000,3400000]].forEach(([m,s,h,o])=>{
  [['01','Penjualan toko',Math.round(s*.4),'Kas'],['15','Penjualan toko',Math.round(s*.6),'Rekening'],['03','Bahan baku',h,'Rekening'],['05','Sewa',900000,'Rekening'],['20','Gaji',1500000,'Rekening'],['12','Listrik & air',350000,'Kas'],['18','Promosi',o-2750000>0?o-2750000:50000,'Kas'],['24','Ambil pribadi',1000000,'Rekening']]
  .forEach(([d,c,v,a])=>demo.tx.push({d:`2026-${m}-${d}`,c,v,a,n:''}))});
demo.bud={'Bahan baku':5000000,'Gaji':1500000,'Promosi':500000,'Listrik & air':400000};
const users=[demo];
let me=null,view='home',page='Dasbor',month=NOW;
const grp=c=>(me.cats.find(x=>x[0]===c)||[])[1];
const inMonth=m=>me.tx.filter(t=>t.d.startsWith(m));
const total=(m,g)=>sum(inMonth(m).filter(t=>grp(t.c)===g),t=>t.v);
const spent=(c,m)=>sum(inMonth(m).filter(t=>t.c===c),t=>t.v);
function pl(m){const s=total(m,'penjualan'),h=total(m,'hpp'),o=total(m,'operasional'),l=total(m,'pendapatan_lain');return{s,h,o,l,kotor:s-h,bersih:s-h-o+l,prive:total(m,'prive')}}
const prev=m=>{const [y,n]=m.split('-').map(Number);return n===1?`${y-1}-12`:`${y}-${String(n-1).padStart(2,'0')}`};
const saldo=a=>me.acc[a]+sum(me.tx.filter(t=>t.a===a),t=>IN.includes(grp(t.c))?t.v:-t.v);
const NAMA={'2026-09':'September','2026-10':'Oktober','2026-11':'November'};
function recs(){const p=pl(NOW),q=pl(prev(NOW)),r=[];
  if(!inMonth(NOW).length)return[['n','Mulai mencatat','Catat penjualan dan pengeluaran bulan ini agar rekomendasi bisa dihitung.']];
  if(p.bersih<0)r.push(['r','Usaha rugi bulan ini',`Rugi ${rp(-p.bersih)}. Periksa pengeluaran terbesar.`]);
  else if(p.s&&p.bersih/p.s<.1)r.push(['y','Margin laba tipis',`Laba bersih hanya ${(p.bersih/p.s*100).toFixed(1)}% dari penjualan. Tinjau harga jual dan HPP.`]);
  Object.entries(me.bud).forEach(([c,l])=>{const x=spent(c,NOW)/l;if(x>1)r.push(['r',`Anggaran ${c} terlewati`,`Terpakai ${Math.round(x*100)}%. Tahan belanja kategori ini.`]);else if(x>=.8)r.push(['y',`Anggaran ${c} hampir habis`,`Terpakai ${Math.round(x*100)}%.`])});
  if(q.o&&p.o>q.o*1.2)r.push(['y','Beban operasional naik',`Naik ${Math.round((p.o/q.o-1)*100)}% dari bulan lalu.`]);
  if(p.prive>0&&p.prive>p.bersih)r.push(['r','Prive melebihi laba',`Diambil ${rp(p.prive)}, laba bersih ${rp(p.bersih)}.`]);
  return r.length?r:[['g','Kondisi aman','Tidak ada aturan peringatan yang terpicu bulan ini.']]}
const recCard=([c,h,m])=>`<div class="rec ${c}"><b>${esc(h)}</b><div>${esc(m)}</div></div>`;

function show(v){view=v;render();scrollTo(0,0)}
function register(e){const f=readForm(e),email=f.email.trim().toLowerCase();
  if(!f.biz.trim()||!f.owner.trim())return toast('Nama usaha dan nama pemilik wajib diisi.');
  if(f.pass.length<8)return toast('Kata sandi minimal 8 karakter.');
  if(f.pass!==f.pass2)return toast('Konfirmasi kata sandi tidak sama.');
  if(users.some(u=>u.email===email))return toast('Email sudah terdaftar.');
  const u=newBiz(f.biz.trim(),f.owner.trim(),email,f.pass);users.push(u);me=u;page='Dasbor';show('app');toast('Pendaftaran berhasil')}
function login(e){const f=readForm(e),u=users.find(u=>u.email===f.email.trim().toLowerCase()&&u.pass===f.pass);
  if(!u)return toast('Email atau kata sandi salah.');me=u;page='Dasbor';show('app')}
function logout(){me=null;show('home')}
function go(p){page=p;show('app')}
function addTx(e){const f=readForm(e);me.tx.push({d:f.d,c:f.c,v:+f.v,a:f.a,n:f.n});render();toast('Tersimpan')}
function addCat(e,g){const f=readForm(e),n=f.n.trim();if(!n||me.cats.some(c=>c[0]===n))return toast('Nama kategori kosong atau sudah ada.');me.cats.push([n,f.g||g]);render()}
function ledger(masuk){const groups=masuk?IN:['hpp','operasional','prive'],rows=me.tx.filter(t=>groups.includes(grp(t.c))).sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="card"><h3>Catat ${masuk?'pemasukan':'pengeluaran'}</h3><form onsubmit="addTx(event)"><label>Tanggal<input type="date" name="d" value="${TODAY}" required></label><label>Kategori<select name="c">${groups.map(g=>`<optgroup label="${LABEL[g]}">${opt(me.cats.filter(c=>c[1]===g).map(c=>c[0]))}</optgroup>`).join('')}</select></label><label>Nominal<input type="number" name="v" min="1" step="1" required></label><label>${masuk?'Masuk ke':'Dibayar dari'}<select name="a">${opt(Object.keys(me.acc))}</select></label><label>Catatan<input name="n"></label><button class="btn">Simpan</button></form></div>
  <div class="card"><h3>Tambah kategori</h3><form onsubmit="addCat(event)"><label>Nama<input name="n" required></label><label>Kelompok<select name="g">${groups.map(g=>`<option value="${g}">${LABEL[g]}</option>`).join('')}</select></label><button class="btn alt">Tambah</button></form></div>
  <div class="card">${table(['Tanggal','Kategori','Kelompok','Akun','Catatan','Nominal'],rows.map(t=>[t.d,esc(t.c),LABEL[grp(t.c)],t.a,esc(t.n),rp(t.v)]))}</div>`}
const budgetList=()=>Object.keys(me.bud).length?Object.entries(me.bud).map(([c,l])=>{const x=spent(c,NOW)/l*100,k=x>100?'r':x>=80?'y':'';return bar(`${esc(c)} <span class="tag ${k||'g'}">${Math.round(x)}%</span>`,`${rp(spent(c,NOW))} dari ${rp(l)}`,x,k)}).join(''):'<p class="k">Belum ada anggaran.</p>';
const plRows=m=>{const p=pl(m);return[['Penjualan',p.s],['HPP',-p.h],['Laba kotor',p.kotor],['Beban operasional',-p.o],['Pendapatan lain',p.l],['Laba bersih',p.bersih]]};
function setBalances(e){const f=readForm(e);Object.keys(me.acc).forEach(a=>me.acc[a]=+f[a]||0);render();toast('Saldo awal disimpan')}
const PAGES={
'Dasbor':()=>{const p=pl(NOW),ms=['2026-09','2026-10','2026-11'],mx=Math.max(1,...ms.flatMap(m=>{const x=pl(m);return[x.s,x.h+x.o]}));
 return `<div class="grid">${stat('Saldo kas & rekening',rp(sum(Object.keys(me.acc),saldo)),Object.keys(me.acc).map(a=>`${a} ${rp(saldo(a))}`).join(' · '))}${stat('Penjualan November',rp(p.s))}${stat('Pengeluaran usaha',rp(p.h+p.o),'HPP + operasional')}<div class="card profit ${p.bersih<0?'loss':''}"><div>${p.bersih<0?'Rugi bersih':'Laba bersih'} November</div><div class="v">${rp(p.bersih)}</div></div></div>
 <div class="split"><div class="card"><h3>Penjualan (biru) vs pengeluaran usaha (oranye)</h3><div class="cols">${ms.map(m=>{const x=pl(m);return `<div class="col"><div><i style="height:${x.s/mx*100}%" title="${rp(x.s)}"></i><i class="y" style="height:${(x.h+x.o)/mx*100}%" title="${rp(x.h+x.o)}"></i></div>${NAMA[m]}</div>`}).join('')}</div></div>
 <div class="card"><h3>Rekomendasi</h3>${recs().slice(0,3).map(recCard).join('')}<button class="btn alt sm" onclick="go('Rekomendasi')">Lihat semua</button></div></div>
 <div class="card"><h3>Saldo awal</h3><form onsubmit="setBalances(event)">${Object.keys(me.acc).map(a=>`<label>${a}<input type="number" name="${a}" min="0" value="${me.acc[a]}"></label>`).join('')}<button class="btn alt">Simpan</button></form></div>`},
'Pemasukan':()=>ledger(true),
'Pengeluaran':()=>ledger(false),
'Anggaran':()=>`<div class="card"><h3>Anggaran November</h3>${budgetList()}</div><div class="card"><form onsubmit="const f=readForm(event);me.bud[f.c]=+f.l;render()"><label>Kategori<select name="c">${opt(me.cats.filter(c=>c[1]==='hpp'||c[1]==='operasional').map(c=>c[0]))}</select></label><label>Batas bulanan<input type="number" name="l" min="1" required></label><button class="btn">Atur</button></form></div>`,
'Laba rugi':()=>`<div class="card"><div class="row"><label>Bulan<select onchange="month=this.value;render()">${Object.entries(NAMA).map(([v,n])=>`<option value="${v}" ${v===month?'selected':''}>${n} 2026</option>`).join('')}</select></label><button class="btn alt" onclick="csv('laba-rugi-'+month+'.csv',[['pos','nominal'],...plRows(month)])">Ekspor CSV</button></div></div>
 <div class="card">${table(['Pos','Nominal'],plRows(month).map(([k,v])=>k.startsWith('Laba')?[`<b>${k}</b>`,`<b>${rp(v)}</b>`]:[k,rp(v)]))}<p class="k">Prive ${rp(pl(month).prive)} tidak mengurangi laba.</p></div>`,
'Rekomendasi':()=>`<div class="card">${recs().map(recCard).join('')}<p class="k">Dihitung otomatis dari catatan usaha. Bukan nasihat keuangan profesional.</p></div>`
};

const auth=(title,body,foot)=>`<div class="auth"><div class="card"><a class="link" onclick="show('home')">← Halaman utama</a><h2>${title}</h2>${body}<p class="k">${foot}</p></div></div>`;
const VIEWS={
home:()=>`<header><h1>${T}</h1><div class="acts"><button class="btn alt" onclick="show('login')">Masuk</button><button class="btn" onclick="show('register')">Daftar</button></div></header>
<section class="hero"><h2>Tahu untung atau rugi usaha Anda setiap bulan</h2><p>Catat pemasukan dan pengeluaran, atur anggaran, dan lihat laporan laba rugi dalam satu tempat.</p><p><button class="btn alt" onclick="show('register')">Daftarkan UMKM Anda</button></p></section>
<section class="feat">${[['💰','Pemasukan & pengeluaran','Pisahkan penjualan, modal, belanja bahan, dan biaya operasional.'],['🎯','Anggaran','Peringatan saat belanja mendekati atau melewati batas.'],['📈','Laba rugi','Laba kotor dan laba bersih dihitung otomatis.'],['💡','Rekomendasi','Saran dari catatan usaha Anda sendiri.']].map(([i,h,d])=>`<div class="card"><div class="ic">${i}</div><h3>${h}</h3><p class="k">${d}</p></div>`).join('')}</section>
<section class="steps"><h2>Cara memulai</h2><div class="feat">${['Daftar dengan nama usaha dan email','Isi saldo awal kas dan rekening','Catat transaksi, lalu baca laporannya'].map((s,i)=>`<div class="card"><div class="v">${i+1}</div><p>${s}</p></div>`).join('')}</div></section>
<footer>${T} · Prototipe tampilan</footer>`,
register:()=>auth('Daftar UMKM',`<form class="stack" onsubmit="register(event)"><label>Nama usaha<input name="biz" required></label><label>Nama pemilik<input name="owner" required></label><label>Email<input type="email" name="email" required></label><label>Kata sandi (minimal 8)<input type="password" name="pass" minlength="8" required autocomplete="new-password"></label><label>Ulangi kata sandi<input type="password" name="pass2" required autocomplete="new-password"></label><button class="btn">Daftar</button></form>`,`Sudah punya akun? <a class="link" onclick="show('login')">Masuk</a>. Prototipe: jangan pakai kata sandi asli.`),
login:()=>auth('Masuk',`<form class="stack" onsubmit="login(event)"><label>Email<input type="email" name="email" required></label><label>Kata sandi<input type="password" name="pass" required></label><button class="btn">Masuk</button></form>`,`Belum punya akun? <a class="link" onclick="show('register')">Daftar</a>.<br>Akun demo: demo@umkm.test / demo1234`),
app:()=>`<header><h1>${T}</h1><div class="acts"><span class="k">${esc(me.name)} · ${esc(me.owner)}</span><button class="btn alt sm" onclick="logout()">Keluar</button></div></header>
<div class="menu"><div id="nav">${Object.keys(PAGES).map(p=>`<button class="${p===page?'on':''}" onclick="go('${p}')">${p}</button>`).join('')}</div></div>
<main><h2>${page}</h2>${PAGES[page]()}<p class="note">Prototipe tampilan. Data tersimpan hanya selama halaman terbuka.</p></main>`
};
function render(){$('#root').innerHTML=VIEWS[view]()}

render();
</script></body></html>
